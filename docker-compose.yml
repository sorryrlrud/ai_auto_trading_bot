services:
  coin-bot:
    build: .
    container_name: quant-ai-bot
    restart: always
    environment:
      HOME: "/tmp/bot-home"
      BOT_UID: "${BOT_UID:-1001}"
      BOT_GID: "${BOT_GID:-1002}"
      TZ: "${TZ:-Asia/Seoul}"
      UPBIT_ACCESS_KEY: "${UPBIT_ACCESS_KEY}"
      UPBIT_SECRET_KEY: "${UPBIT_SECRET_KEY}"
      TRADE_ENABLED: "${TRADE_ENABLED:-false}"
      RUN_ONCE: "${RUN_ONCE:-false}"
      LOOP_SLEEP_SECONDS: "${LOOP_SLEEP_SECONDS:-900}"
      UPBIT_HTTP_TIMEOUT_SECONDS: "${UPBIT_HTTP_TIMEOUT_SECONDS:-10}"
      DASHBOARD_AUTO_PUBLISH: "${DASHBOARD_AUTO_PUBLISH:-false}"
      DASHBOARD_HEARTBEAT_PUBLISH_SECONDS: "${DASHBOARD_HEARTBEAT_PUBLISH_SECONDS:-3600}"
    volumes:
      - .:/app
      - ${HOME}/.ssh:/host-ssh:ro
    command: ["sh", "/app/docker-entrypoint.sh"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
