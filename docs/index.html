<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auto Trading Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --panel: #171a1d;
      --muted: #96a0aa;
      --text: #f2f5f7;
      --line: #2a3036;
      --green: #4ade80;
      --red: #fb7185;
      --accent: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(1120px, calc(100% - 32px));
      margin: 32px auto 48px;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-end;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      letter-spacing: 0;
    }
    .muted { color: var(--muted); }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    .label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }
    .value {
      font-size: 24px;
      font-weight: 700;
    }
    .positive { color: var(--green); }
    .negative { color: var(--red); }
    .table-wrap {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .section-title {
      margin: 28px 0 12px;
      font-size: 18px;
    }
    .runtime-card {
      display: grid;
      gap: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .runtime-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .runtime-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--muted);
      flex: 0 0 auto;
    }
    .runtime-dot.healthy { background: var(--green); }
    .runtime-dot.delayed { background: #facc15; }
    .runtime-dot.suspicious { background: var(--red); }
    .runtime-state {
      font-size: 18px;
      font-weight: 700;
    }
    .runtime-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .runtime-meta {
      display: grid;
      gap: 4px;
      font-size: 14px;
    }
    .decision-grid {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }
    .decision-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    .decision-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 12px;
    }
    .decision-list {
      display: grid;
      gap: 8px;
    }
    .decision-item {
      display: grid;
      grid-template-columns: 92px 64px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      font-size: 14px;
    }
    .badge {
      display: inline-flex;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge.buy { color: var(--green); }
    .badge.sell { color: var(--red); }
    .badge.hold { color: var(--accent); }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 14px;
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      background: rgba(255, 255, 255, 0.02);
    }
    tbody tr:last-child td { border-bottom: 0; }
    td.num, th.num { text-align: right; }
    .empty {
      padding: 36px 16px;
      text-align: center;
      color: var(--muted);
    }
    @media (max-width: 760px) {
      header {
        display: block;
      }
      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .runtime-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        min-width: 760px;
      }
      .decision-item {
        grid-template-columns: 1fr;
        gap: 4px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Auto Trading Dashboard</h1>
        <div class="muted">실현 완료된 매도 기록 기준</div>
      </div>
      <div class="muted" id="generated-at"></div>
    </header>

    <section class="stats">
      <article class="stat">
        <div class="label">누적 실현손익</div>
        <div class="value" id="total-profit"></div>
      </article>
      <article class="stat">
        <div class="label">누적 수익률</div>
        <div class="value" id="total-return"></div>
      </article>
      <article class="stat">
        <div class="label">승률</div>
        <div class="value" id="win-rate"></div>
      </article>
      <article class="stat">
        <div class="label">완료 매매</div>
        <div class="value" id="trade-count"></div>
      </article>
    </section>

    <h2 class="section-title">운영 상태</h2>
    <section class="runtime-card">
      <div class="runtime-head">
        <span class="runtime-dot" id="runtime-dot"></span>
        <div>
          <div class="runtime-state" id="runtime-state"></div>
          <div class="muted" id="runtime-summary"></div>
        </div>
      </div>
      <div class="runtime-grid">
        <div class="runtime-meta">
          <div class="label">마지막 성공 사이클</div>
          <div id="runtime-last-success"></div>
        </div>
        <div class="runtime-meta">
          <div class="label">마지막 완료 사이클</div>
          <div id="runtime-last-completed"></div>
        </div>
        <div class="runtime-meta">
          <div class="label">다음 예상 사이클</div>
          <div id="runtime-next-cycle"></div>
        </div>
        <div class="runtime-meta">
          <div class="label">최근 오류</div>
          <div id="runtime-last-error"></div>
        </div>
      </div>
    </section>

    <h2 class="section-title">최근 판단 로그</h2>
    <section class="decision-grid" id="decision-cards"></section>
    <div class="empty" id="decision-empty" hidden>아직 공개할 판단 로그가 없습니다.</div>

    <h2 class="section-title">실현 매매 기록</h2>
    <section class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>체결 시각</th>
            <th>종목</th>
            <th class="num">손익금액</th>
            <th class="num">수익률</th>
            <th class="num">매수원가</th>
            <th class="num">수수료</th>
            <th>매도 사유</th>
          </tr>
        </thead>
        <tbody id="trade-rows"></tbody>
      </table>
      <div class="empty" id="empty-state" hidden>아직 공개할 실현 매매 기록이 없습니다.</div>
    </section>
  </main>

  <script id="dashboard-data" type="application/json">{"summary": {"trade_count": 7, "win_rate": 14.29, "amount_trade_count": 7, "total_profit_krw": -918.78, "avg_profit_pct": -1.1866, "total_return_pct": -1.0844, "generated_at": "2026-06-11T00:16:31+09:00"}, "trades": [{"executed_at": "2026-05-17T10:10:04+00:00", "ticker": "KRW-USDT", "profit_pct": 0.2868, "profit_krw": 40.39, "cost_basis_krw": 14086.21, "gross_proceeds_krw": 14133.68, "fee_krw": 7.07, "reason": "BTC 방어장세 및 개별 추세 훼손", "source": "order_detail"}, {"executed_at": "2026-05-17T14:44:04+00:00", "ticker": "KRW-DOGE", "profit_pct": -0.6521, "profit_krw": -92.17, "cost_basis_krw": 14133.97, "gross_proceeds_krw": 14048.83, "fee_krw": 7.02, "reason": "손실 -1.2% 및 단기 추세 훼손", "source": "order_detail"}, {"executed_at": "2026-05-18T03:58:28+09:00", "ticker": "KRW-BORA", "profit_pct": -0.5982, "profit_krw": -31.5, "cost_basis_krw": 5266.53, "gross_proceeds_krw": 5237.65, "fee_krw": 2.62, "reason": "손실 -0.73% 및 단기 추세 훼손", "source": "order_detail"}, {"executed_at": "2026-05-18T05:51:22+09:00", "ticker": "KRW-ATOM", "profit_pct": -0.5689, "profit_krw": -109.62, "cost_basis_krw": 19269.17, "gross_proceeds_krw": 19169.14, "fee_krw": 9.58, "reason": "BTC 방어장세 및 개별 추세 훼손", "source": "order_detail"}, {"executed_at": "2026-05-18T06:55:59+09:00", "ticker": "KRW-FF", "profit_pct": -1.5307, "profit_krw": -147.24, "cost_basis_krw": 9618.66, "gross_proceeds_krw": 9476.17, "fee_krw": 4.74, "reason": "손실 -1.48% 및 단기 추세 훼손", "source": "order_detail"}, {"executed_at": "2026-05-18T08:48:53+09:00", "ticker": "KRW-AKT", "profit_pct": -2.8591, "profit_krw": -275.01, "cost_basis_krw": 9618.66, "gross_proceeds_krw": 9348.33, "fee_krw": 4.67, "reason": "손실 -2.72%로 손절 기준 도달", "source": "order_detail"}, {"executed_at": "2026-05-18T09:46:27+09:00", "ticker": "KRW-KAITO", "profit_pct": -2.384, "profit_krw": -303.63, "cost_basis_krw": 12736.0, "gross_proceeds_krw": 12438.59, "fee_krw": 6.22, "reason": "손실 -2.34%로 손절 기준 도달", "source": "order_detail"}], "recent_decisions": [{"recorded_at": "2026-05-18T14:16:24+09:00", "risk_mode": "defensive", "cash_reserve_pct": 80, "buy_threshold": 12.5, "buy_budget_krw": 12738.0, "entry_block_reason": "BTC 방어장세에서는 신규 매수 차단", "decisions": []}, {"recorded_at": "2026-05-18T14:31:24+09:00", "risk_mode": "defensive", "cash_reserve_pct": 80, "buy_threshold": 12.5, "buy_budget_krw": 12738.0, "entry_block_reason": "BTC 방어장세에서는 신규 매수 차단", "decisions": []}, {"recorded_at": "2026-05-18T14:46:24+09:00", "risk_mode": "defensive", "cash_reserve_pct": 80, "buy_threshold": 12.5, "buy_budget_krw": 12738.0, "entry_block_reason": "BTC 방어장세에서는 신규 매수 차단", "decisions": []}], "runtime_status": {"loop_interval_seconds": 900, "heartbeat_publish_interval_seconds": 3600, "last_cycle_started_at": "2026-06-11T00:15:20+09:00", "last_cycle_completed_at": "2026-06-11T00:16:31+09:00", "last_success_at": "2026-06-11T00:16:31+09:00", "next_expected_cycle_at": "2026-06-11T00:30:20+09:00", "consecutive_failures": 0, "last_dashboard_refresh_at": "2026-06-10T23:01:32+09:00"}}</script>
  <script>
    const data = JSON.parse(document.getElementById("dashboard-data").textContent);
    const won = new Intl.NumberFormat("ko-KR", { maximumFractionDigits: 0 });
    const pct = new Intl.NumberFormat("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const signedWon = (value) => value == null ? "-" : `${value > 0 ? "+" : ""}${won.format(value)}원`;
    const signedPct = (value) => value == null ? "-" : `${value > 0 ? "+" : ""}${pct.format(value)}%`;
    const tone = (value) => value > 0 ? "positive" : value < 0 ? "negative" : "";

    document.getElementById("generated-at").textContent =
      `마지막 갱신 ${data.summary.generated_at}`;

    const runtime = data.runtime_status || {};
    const parseDate = (value) => value ? new Date(value) : null;
    const formatValue = (value) => value || "-";
    const generatedAt = parseDate(data.summary.generated_at);
    const lastSuccessAt = parseDate(runtime.last_success_at);
    const lastErrorAt = parseDate(runtime.last_error_at);
    const heartbeatSeconds = Number(runtime.heartbeat_publish_interval_seconds || 3600);
    const loopSeconds = Number(runtime.loop_interval_seconds || 900);
    const freshLimitSeconds = heartbeatSeconds + loopSeconds;
    const staleLimitSeconds = heartbeatSeconds * 2 + loopSeconds;
    const pageAgeSeconds = generatedAt ? Math.max((Date.now() - generatedAt.getTime()) / 1000, 0) : Infinity;
    const successLagAtGenerationSeconds =
      generatedAt && lastSuccessAt ? Math.max((generatedAt.getTime() - lastSuccessAt.getTime()) / 1000, 0) : Infinity;

    let runtimeTone = "";
    let runtimeState = "확인 불가";
    let runtimeSummary = "운영 상태 파일이 아직 생성되지 않았습니다.";
    if (lastSuccessAt) {
      const unrecoveredError = lastErrorAt && lastErrorAt > lastSuccessAt;
      if (unrecoveredError) {
        runtimeTone = "delayed";
        runtimeState = "오류 이후 성공 미확인";
        runtimeSummary = "최근 오류 이후 정상 완료가 아직 확인되지 않았습니다.";
      } else if (pageAgeSeconds > staleLimitSeconds) {
        runtimeTone = "suspicious";
        runtimeState = "정지 또는 게시 실패 의심";
        runtimeSummary = "공개 heartbeat가 두 주기 이상 갱신되지 않았습니다.";
      } else if (pageAgeSeconds > freshLimitSeconds || successLagAtGenerationSeconds > loopSeconds * 2) {
        runtimeTone = "delayed";
        runtimeState = "갱신 지연";
        runtimeSummary = "마지막 공개 heartbeat가 예상보다 늦습니다.";
      } else {
        runtimeTone = "healthy";
        runtimeState = "최근 정상 확인";
        runtimeSummary = "최근 공개 heartbeat 기준으로 봇이 정상 완료되었습니다.";
      }
    }
    const runtimeDot = document.getElementById("runtime-dot");
    if (runtimeTone) {
      runtimeDot.classList.add(runtimeTone);
    }
    document.getElementById("runtime-state").textContent = runtimeState;
    document.getElementById("runtime-summary").textContent = runtimeSummary;
    document.getElementById("runtime-last-success").textContent = formatValue(runtime.last_success_at);
    document.getElementById("runtime-last-completed").textContent = formatValue(runtime.last_cycle_completed_at);
    document.getElementById("runtime-next-cycle").textContent = formatValue(runtime.next_expected_cycle_at);
    document.getElementById("runtime-last-error").textContent = runtime.last_error_at
      ? `${runtime.last_error_at}${runtime.last_error_type ? ` · ${runtime.last_error_type}` : ""}`
      : "없음";

    const statMap = [
      ["total-profit", signedWon(data.summary.total_profit_krw), data.summary.total_profit_krw],
      ["total-return", signedPct(data.summary.total_return_pct), data.summary.total_return_pct],
      ["win-rate", `${pct.format(data.summary.win_rate)}%`, data.summary.win_rate],
      ["trade-count", `${won.format(data.summary.trade_count)}건`, 0],
    ];
    for (const [id, text, value] of statMap) {
      const node = document.getElementById(id);
      node.textContent = text;
      const valueTone = tone(value);
      if (valueTone) {
        node.classList.add(valueTone);
      }
    }

    const decisionCards = document.getElementById("decision-cards");
    const decisionEmpty = document.getElementById("decision-empty");
    if (!data.recent_decisions.length) {
      decisionEmpty.hidden = false;
    } else {
      for (const entry of [...data.recent_decisions].reverse()) {
        const card = document.createElement("article");
        card.className = "decision-card";
        const meta = document.createElement("div");
        meta.className = "decision-meta";
        const entryBlock = entry.entry_block_reason ? ` · entry_block=${entry.entry_block_reason}` : "";
        meta.textContent =
          `${entry.recorded_at || "-"} · risk=${entry.risk_mode || "-"} · cash=${entry.cash_reserve_pct ?? "-"}% · threshold=${entry.buy_threshold ?? "-"} · budget=${entry.buy_budget_krw == null ? "-" : `${won.format(entry.buy_budget_krw)}원`}${entryBlock}`;
        card.appendChild(meta);

        const list = document.createElement("div");
        list.className = "decision-list";
        const decisions = entry.decisions || [];
        for (const decision of decisions) {
          const item = document.createElement("div");
          item.className = "decision-item";
          const ticker = document.createElement("div");
          ticker.textContent = decision.ticker || "-";
          const badge = document.createElement("div");
          badge.className = `badge ${String(decision.decision || "").toLowerCase()}`;
          badge.textContent = decision.decision || "-";
          const reason = document.createElement("div");
          reason.textContent = decision.reason || "-";
          item.append(ticker, badge, reason);
          list.appendChild(item);
        }
        if (!decisions.length && entry.entry_block_reason) {
          const item = document.createElement("div");
          item.className = "muted";
          item.textContent = `신규 진입 차단: ${entry.entry_block_reason}`;
          list.appendChild(item);
        }
        if (entry.entry_rejections?.length) {
          const item = document.createElement("div");
          item.className = "muted";
          item.textContent =
            `진입 후보 탈락: ${entry.entry_rejections.map((row) => `${row.ticker}(${row.reason})`).join(", ")}`;
          list.appendChild(item);
        }
        card.appendChild(list);
        decisionCards.appendChild(card);
      }
    }

    const rows = document.getElementById("trade-rows");
    const empty = document.getElementById("empty-state");
    if (!data.trades.length) {
      rows.closest("table").hidden = true;
      empty.hidden = false;
    } else {
      for (const trade of [...data.trades].reverse()) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${trade.executed_at || "-"}</td>
          <td>${trade.ticker}</td>
          <td class="num ${tone(trade.profit_krw)}">${signedWon(trade.profit_krw)}</td>
          <td class="num ${tone(trade.profit_pct)}">${signedPct(trade.profit_pct)}</td>
          <td class="num">${trade.cost_basis_krw == null ? "-" : `${won.format(trade.cost_basis_krw)}원`}</td>
          <td class="num">${trade.fee_krw == null ? "-" : `${won.format(trade.fee_krw)}원`}</td>
          <td>${trade.reason || "-"}</td>
        `;
        rows.appendChild(tr);
      }
    }
  </script>
</body>
</html>
