<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auto Trading Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --panel: #171a1d;
      --muted: #96a0aa;
      --text: #f2f5f7;
      --line: #2a3036;
      --green: #4ade80;
      --red: #fb7185;
      --accent: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(1120px, calc(100% - 32px));
      margin: 32px auto 48px;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-end;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      letter-spacing: 0;
    }
    .muted { color: var(--muted); }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    .label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }
    .value {
      font-size: 24px;
      font-weight: 700;
    }
    .positive { color: var(--green); }
    .negative { color: var(--red); }
    .table-wrap {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .section-title {
      margin: 28px 0 12px;
      font-size: 18px;
    }
    .runtime-card {
      display: grid;
      gap: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .runtime-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .runtime-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--muted);
      flex: 0 0 auto;
    }
    .runtime-dot.healthy { background: var(--green); }
    .runtime-dot.delayed { background: #facc15; }
    .runtime-dot.suspicious { background: var(--red); }
    .runtime-state {
      font-size: 18px;
      font-weight: 700;
    }
    .runtime-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .runtime-meta {
      display: grid;
      gap: 4px;
      font-size: 14px;
    }
    .decision-grid {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }
    .decision-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    .decision-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 12px;
    }
    .decision-list {
      display: grid;
      gap: 8px;
    }
    .decision-item {
      display: grid;
      grid-template-columns: 92px 64px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      font-size: 14px;
    }
    .badge {
      display: inline-flex;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge.buy { color: var(--green); }
    .badge.sell { color: var(--red); }
    .badge.hold { color: var(--accent); }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 14px;
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      background: rgba(255, 255, 255, 0.02);
    }
    tbody tr:last-child td { border-bottom: 0; }
    td.num, th.num { text-align: right; }
    .empty {
      padding: 36px 16px;
      text-align: center;
      color: var(--muted);
    }
    @media (max-width: 760px) {
      header {
        display: block;
      }
      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .runtime-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        min-width: 760px;
      }
      .decision-item {
        grid-template-columns: 1fr;
        gap: 4px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Auto Trading Dashboard</h1>

      </div>
      <div class="muted" id="generated-at"></div>

    <section class="stats">

      <article class="stat">

      <article class="stat">

    <h2 class="section-title">운영 상태</h2>

        <div>

        <div class="runtime-meta">

        <div class="runtime-meta">
          <div class="label">최근 오류</div>
          <div id="runtime-last-error"></div>
        </div>
      </div>
    </section>

    <h2 class="section-title">최근 판단 로그</h2>
    <section class="decision-grid" id="decision-cards"></section>
    <div class="empty" id="decision-empty" hidden>아직 공개할 판단 로그가 없습니다.</div>

    <h2 class="section-title">실현 매매 기록</h2>
    <section class="table-wrap">

      </table>
      <div class="empty" id="empty-state" hidden>아직 공개할 실현 매매 기록이 없습니다.</div>
    </section>
  </main>

    if (lastSuccessAt) {
      const unrecoveredError = lastErrorAt && lastErrorAt > lastSuccessAt;
      if (unrecoveredError) {
        runtimeTone = "delayed";
        runtimeState = "오류 이후 성공 미확인";
        runtimeSummary = "최근 오류 이후 정상 완료가 아직 확인되지 않았습니다.";
      } else if (pageAgeSeconds > staleLimitSeconds) {
        runtimeTone = "suspicious";
        runtimeState = "정지 또는 게시 실패 의심";
        runtimeSummary = "공개 heartbeat가 두 주기 이상 갱신되지 않았습니다.";
      } else if (pageAgeSeconds > freshLimitSeconds || successLagAtGenerationSeconds > loopSeconds * 2) {
        runtimeTone = "delayed";
        runtimeState = "갱신 지연";
        runtimeSummary = "마지막 공개 heartbeat가 예상보다 늦습니다.";
      } else {
        runtimeTone = "healthy";
        runtimeState = "최근 정상 확인";
        runtimeSummary = "최근 공개 heartbeat 기준으로 봇이 정상 완료되었습니다.";
      }
    }
    const runtimeDot = document.getElementById("runtime-dot");
    if (runtimeTone) {
      runtimeDot.classList.add(runtimeTone);
    }
    document.getElementById("runtime-state").textContent = runtimeState;
    document.getElementById("runtime-summary").textContent = runtimeSummary;
    document.getElementById("runtime-last-success").textContent = formatValue(runtime.last_success_at);
    document.getElementById("runtime-last-completed").textContent = formatValue(runtime.last_cycle_completed_at);
    document.getElementById("runtime-next-cycle").textContent = formatValue(runtime.next_expected_cycle_at);
    document.getElementById("runtime-last-error").textContent = runtime.last_error_at
      ? `${runtime.last_error_at}${runtime.last_error_type ? ` · ${runtime.last_error_type}` : ""}`
      : "없음";

    const statMap = [
      ["total-profit", signedWon(data.summary.total_profit_krw), data.summary.total_profit_krw],
      ["total-return", signedPct(data.summary.total_return_pct), data.summary.total_return_pct],
      ["win-rate", `${pct.format(data.summary.win_rate)}%`, data.summary.win_rate],
      ["trade-count", `${won.format(data.summary.trade_count)}건`, 0],
    ];
    for (const [id, text, value] of statMap) {
      const node = document.getElementById(id);
      node.textContent = text;
      const valueTone = tone(value);
      if (valueTone) {
        node.classList.add(valueTone);
      }
    }

    const decisionCards = document.getElementById("decision-cards");
    const decisionEmpty = document.getElementById("decision-empty");
    if (!data.recent_decisions.length) {
      decisionEmpty.hidden = false;
    } else {
      for (const entry of [...data.recent_decisions].reverse()) {
        const card = document.createElement("article");
        card.className = "decision-card";
        const meta = document.createElement("div");
        meta.className = "decision-meta";
        const entryBlock = entry.entry_block_reason ? ` · entry_block=${entry.entry_block_reason}` : "";
        meta.textContent =
          `${entry.recorded_at || "-"} · risk=${entry.risk_mode || "-"} · cash=${entry.cash_reserve_pct ?? "-"}% · threshold=${entry.buy_threshold ?? "-"} · budget=${entry.buy_budget_krw == null ? "-" : `${won.format(entry.buy_budget_krw)}원`}${entryBlock}`;
        card.appendChild(meta);

        const list = document.createElement("div");
        list.className = "decision-list";
        const decisions = entry.decisions || [];
        for (const decision of decisions) {
          const item = document.createElement("div");
          item.className = "decision-item";
          const ticker = document.createElement("div");
          ticker.textContent = decision.ticker || "-";
          const badge = document.createElement("div");
          badge.className = `badge ${String(decision.decision || "").toLowerCase()}`;
          badge.textContent = decision.decision || "-";
          const reason = document.createElement("div");
          reason.textContent = decision.reason || "-";
          item.append(ticker, badge, reason);
          list.appendChild(item);
        }
        if (!decisions.length && entry.entry_block_reason) {
          const item = document.createElement("div");
          item.className = "muted";
          item.textContent = `신규 진입 차단: ${entry.entry_block_reason}`;
          list.appendChild(item);
        }
        if (entry.entry_rejections?.length) {
          const item = document.createElement("div");
          item.className = "muted";
          item.textContent =
            `진입 후보 탈락: ${entry.entry_rejections.map((row) => `${row.ticker}(${row.reason})`).join(", ")}`;
          list.appendChild(item);
        }
        card.appendChild(list);
        decisionCards.appendChild(card);
      }
    }

    const rows = document.getElementById("trade-rows");
    const empty = document.getElementById("empty-state");
    if (!data.trades.length) {
      rows.closest("table").hidden = true;
      empty.hidden = false;
    } else {
      for (const trade of [...data.trades].reverse()) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${trade.executed_at || "-"}</td>
          <td>${trade.ticker}</td>
          <td class="num ${tone(trade.profit_krw)}">${signedWon(trade.profit_krw)}</td>
          <td class="num ${tone(trade.profit_pct)}">${signedPct(trade.profit_pct)}</td>
          <td class="num">${trade.cost_basis_krw == null ? "-" : `${won.format(trade.cost_basis_krw)}원`}</td>
          <td class="num">${trade.fee_krw == null ? "-" : `${won.format(trade.fee_krw)}원`}</td>
          <td>${trade.reason || "-"}</td>
        `;
        rows.appendChild(tr);
      }
    }
  </script>
</body>
</html>
